spring.application.name=A3LamThoaiThanh_SE1910
server.port=${SERVER_PORT:8083}
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A3LamThoaiThanh_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.staff.email=${HOTEL_STAFF_EMAIL:staff@fuminihotel.local}
app.staff.password=${HOTEL_STAFF_PASSWORD:}
app.jwt.secret=${HOTEL_JWT_SECRET:}
app.cors.origin=${HOTEL_FRONTEND_ORIGIN:http://localhost:5175}

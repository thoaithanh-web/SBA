spring.application.name=A2LamThoaiThanh_SE1910
server.port=${SERVER_PORT:8082}
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2LamThoaiThanh_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${SHOW_SQL:false}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
spring.data.web.pageable.max-page-size=100
server.error.include-message=never

name: Bug report
description: Report a reproducible coursework defect
title: '[bug] '
labels: [bug]
body:
  - type: input
    id: location
    attributes:
      label: Assignment or lab
      placeholder: ass1/LamThoaiThanh_SE1910
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
    validations:
      required: true

name: Lab05 Full Stack
on:
  push:
    branches: [main]
    paths: ['lab05/**', '.github/workflows/lab05.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab05/frontend/package-lock.json
      - name: Prepare SQL Server
        shell: bash
        run: |
          password="Sba!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DB_USERNAME=sa" >> "$GITHUB_ENV"
          echo "SQLSERVER_TESTS=true" >> "$GITHUB_ENV"
          docker run -d --name lab05-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec -e "SQLCMDPASSWORD=$password" lab05-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "IF DB_ID(N'OrchidManagementDB') IS NULL CREATE DATABASE OrchidManagementDB;"; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: Verify and package backend
        working-directory: lab05/backend
        run: mvn -B -ntp clean verify
      - name: Start backend
        working-directory: lab05/backend
        shell: bash
        run: |
          java -jar target/backend-1.0.0.jar > target/application.log 2>&1 &
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/orchids; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: Install frontend
        working-directory: lab05/frontend
        run: npm ci
      - name: Check frontend
        working-directory: lab05/frontend
        run: |
          npm run format:check
          npm run lint
          npm run build
      - name: Install Chromium
        working-directory: lab05/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        working-directory: lab05/frontend
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab05-diagnostics
          path: |
            lab05/backend/target/surefire-reports/
            lab05/backend/target/application.log
            lab05/frontend/playwright-report/
            lab05/frontend/test-results/
